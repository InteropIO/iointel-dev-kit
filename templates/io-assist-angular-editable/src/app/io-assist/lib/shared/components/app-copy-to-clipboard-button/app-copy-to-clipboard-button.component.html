<app-tooltip [tooltipPosition]="TOOLTIP_POSITIONS.TOP" [displayMode]="TOOLTIP_DISPLAY_MODES.EVENT" [forceVisible]="isCopiedSignal()">
    <button tooltip-trigger class="app-copy-to-clipboard-button flex items-center justify-center cursor-pointer rounded-[6px]" [attr.data-testid]="dataTestId() || null" (click)="handleCopyResponse()">
        <!-- Icon: outline copy that brightens on hover (same as the tool trace's copy) / tick (copied) -->
        @if (!isCopiedSignal()) {
            <app-icon
                iconFill="--app-icon-default"
                hoverIconFill="--app-icon-hover"
                [variant]="APP_ICON_VARIANTS.COPY"
                [hoverBackgroundColor]="'--app-icon-button-hover'"
                [isHoveredExternal]="isHoveredSignal()"
                [tabIndex]="-1"
            ></app-icon>
        }

        @if (isCopiedSignal()) {
            <app-icon [title]="''" [variant]="APP_ICON_VARIANTS.CHECK" [hoverBackgroundColor]="'--app-icon-button-hover'" [isHoveredExternal]="isHoveredSignal()" [tabIndex]="-1"></app-icon>
        }
    </button>

    <span tooltip-content class="whitespace-nowrap">
        {{ UI_STRINGS.COPIED }}
    </span>
</app-tooltip>
