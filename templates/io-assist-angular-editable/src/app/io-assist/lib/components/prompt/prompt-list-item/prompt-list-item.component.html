@let promptName = prompt().name;
<!-- @let isAnyOperationPending = isUpdatePending() || isDeletePending(); -->
<!-- @let favoriteListItemMode = isDisplayedInFavoriteList(); -->
@let isFavorite = isCurrentPromptInFavorites();

<div
    class="flex flex-1 justify-between items-center gap-2 cursor-pointer min-w-0 focus-visible:outline-none focus-visible:shadow-[inset_0_0_0_2px_var(--app-focus-ring)]"
    data-testid="prompt-list-item"
    tabindex="0"
    role="button"
    [ngClass]="{
        'min-h-[36px] pl-[14px] pr-[7px] hover:bg-app-background-secondary': !isDisplayedInFavoriteList(),
        'pl-3 pr-[5px] h-10 hover:shadow-[0_0.5px_0.5px_0.5px_rgba(0,0,0,0.15)] rounded-xl': isDisplayedInFavoriteList(),
    }"
    (click)="handlePromptSelect()"
    (keydown.enter)="handlePromptSelect()"
    (keydown.space)="$event.preventDefault(); handlePromptSelect()"
>
    <!-- Prompt Title -->
    <span
        class="flex-1 min-w-0 overflow-hidden text-ellipsis whitespace-nowrap"
        [ngClass]="{
            'text-[13px]': !isDisplayedInFavoriteList(),
            'text-xs': isDisplayedInFavoriteList(),
            'text-text-default': true,
            'text-text-states-hover': isHostHoveredSignal(),
        }"
        >{{ promptName }}</span
    >

    <app-icon
        data-testid="prompt-favorite-button"
        class="p-2 ps-1 shrink-0"
        [variant]="isFavorite ? APP_ICON_VARIANTS.STAR_FILLED : APP_ICON_VARIANTS.STAR_OUTLINE"
        [isHoveredExternal]="isHostHoveredSignal()"
        (click)="handlePromptToggleFavorite($event)"
    ></app-icon>
</div>
