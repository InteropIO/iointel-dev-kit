            >

                    data-testid="thread-user-name"
                    [ngClass]="{
                        'text-text-default text-[12px] leading-[12px] font-weight-400 truncate': true,
                    }"
                    [attr.title]="username()"
                >
                    {{ username() }}
                </span>
            </div>
        </div>
    }
