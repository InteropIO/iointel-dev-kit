<div
    #scrollArea
    data-testid="scroll-area"
    class="scroll-area"
    [ngClass]="{
        'flex flex-1 flex-col min-h-0 min-w-0 overflow-x-hidden overflow-y-auto custom-scrollbar': true,
        'scroll-fade-edges': hasFadeEdges(),
    }"
    (scroll)="handleOnScroll()"
>
    <ng-content></ng-content>

    <div #spacerElement class="scroll-area__spacer"></div>
</div>

@if (!isCloseToBottom()) {
    <button
        type="button"
        data-testid="scroll-to-bottom"
        class="absolute bottom-5 self-center z-[999] flex items-center justify-center box-border w-10 h-10 p-0 rounded-full border border-[var(--app-floating-border)] bg-[var(--app-scroll-button-background)] shadow-[var(--app-floating-shadow)] cursor-pointer [transition:opacity_500ms_ease-in-out,background-color_150ms_ease-out] hover:bg-[var(--app-scroll-button-background-hover)] focus-visible:outline-none focus-visible:shadow-[inset_0_0_0_2px_var(--app-focus-ring),var(--app-floating-shadow)]"
        [attr.aria-label]="UI_STRINGS.SCROLL_TO_BOTTOM"
        [title]="UI_STRINGS.SCROLL_TO_BOTTOM"
        (click)="scrollToBottom()"
    >
        <app-icon
            aria-hidden="true"
            iconFill="--app-text-states-active"
            hoverIconFill="--app-text-states-active"
            [title]="''"
            [tabIndex]="-1"
            [isWrapped]="false"
            [variant]="APP_ICON_VARIANTS.ARROW_DOWN"
            [size]="APP_ICON_SIZES.XS"
        ></app-icon>
    </button>
}
