@let toolName = tool().name;
<div data-testid="tool-list-item">
    <div
        class="flex justify-between content-center items-center min-h-[36px] pl-[14px] pr-2 gap-2 cursor-pointer"
        [ngClass]="{
            'hover:bg-app-background-secondary': isHovered(),
            'bg-app-background-secondary': isDetailsOpen(),
        }"
        (click)="handleDetailsToggle($event)"
    >
        <app-toggle data-testid="tool-toggle" [isChecked]="isEnabled()" (onToggle)="handleToolToggle(tool())" />

        <!-- Tool Title -->
        <span
            class="flex-1 min-w-0 overflow-hidden text-ellipsis whitespace-nowrap text-text-default text-[13px]"
            [ngClass]="{
                'text-text-states-hover': isHovered(),
            }"
            >{{ toolName }}</span
        >

        <!-- Tool details toggle (click / tap / Enter / Space) -->
        <button
            type="button"
            class="inline-flex shrink-0 items-center justify-center w-6 h-6 p-0 rounded-full bg-transparent cursor-pointer focus-visible:outline-none focus-visible:shadow-[inset_0_0_0_2px_var(--app-focus-ring)]"
            data-testid="tool-info-icon"
            [ngClass]="{
                'bg-icon-button-selected hover:bg-icon-button-selected': isDetailsOpen(),
                'hover:bg-icon-button-hover': !isDetailsOpen(),
            }"
            [attr.aria-expanded]="isDetailsOpen()"
            [attr.aria-controls]="detailsId()"
            [attr.aria-label]="UI_STRINGS.SHOW_DETAILS(toolName)"
            (click)="handleDetailsToggle($event)"
        >
            <app-icon
                aria-hidden="true"
                [title]="''"
                [tabIndex]="-1"
                [isWrapped]="false"
                [variant]="APP_ICON_VARIANTS.INFO"
                [iconFill]="isDetailsOpen() || isHovered() ? '--app-text-states-active' : '--app-text-default'"
                [hoverIconFill]="'--app-text-states-active'"
                [size]="APP_ICON_SIZES.XS"
            ></app-icon>
        </button>
    </div>

    @if (isDetailsOpen()) {
        <tool-details data-testid="tool-details" [id]="detailsId()" [tool]="tool()"></tool-details>
    }
</div>
